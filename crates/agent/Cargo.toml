[package]
name = "headroom-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
headroom-core = { path = "../core" }
headroom-sys = { path = "../sys" }
headroom-ipc = { path = "../ipc" }
headroom-engine = { path = "../engine" }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Graphics_Gdi",
] }
