ShortDescription: Evidence-based native Win32 memory diagnostic and management utility.
Description: |
  Headroom is a lightweight, zero-telemetry Windows memory utility designed for low-RAM PCs and gamers.
  Unlike traditional RAM cleaners that cosmetically purge caches at the expense of disk thrashing,
  Headroom diagnoses true memory pressure versus healthy caching, protects active games and foreground apps,
  and writes an auditable receipt for every cleaning action showing memory freed and subsequent 60-second read-back.
